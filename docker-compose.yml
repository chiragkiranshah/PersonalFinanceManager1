version: '3.9'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finance-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: finance-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  account-api:
    build:
      context: ./src/Services/Account/Account.Api
      dockerfile: Dockerfile
    container_name: finance-account-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${ACCOUNT_DB_CONNECTION_STRING}
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5101:8080"

  transaction-api:
    build:
      context: ./src/Services/Transaction/Transaction.Api
      dockerfile: Dockerfile
    container_name: finance-transaction-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${TRANSACTION_DB_CONNECTION_STRING}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5102:8080"

  gateway:
    build:
      context: ./src/ApiGateway
      dockerfile: Dockerfile
    container_name: finance-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__accountCluster__Destinations__accountService__Address: http://account-api:8080
      ReverseProxy__Clusters__transactionCluster__Destinations__transactionService__Address: http://transaction-api:8080
    depends_on:
      account-api:
        condition: service_started
      transaction-api:
        condition: service_started
    ports:
      - "5000:8080"
